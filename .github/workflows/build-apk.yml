
name: Build India Update APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare website files
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.json icon.svg sw.js www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.indiaupdate.news",
            "appName": "India Update",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: India-Update-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
